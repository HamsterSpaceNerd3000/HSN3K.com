<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Releases</title>
  <link rel="icon" type="image/x-icon" href="../images/RLCLogo.ico">
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../styles/dwnlnk_styles.css">
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .page-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .release-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .release-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .release-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
    }

    .release-date {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .release-notes {
      list-style-type: disc;
      padding-left: 1.25rem;
      margin-bottom: 1.5rem;
      color: var(--text-main);
    }

    .release-notes li {
      margin-bottom: 0.35rem;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--accent);
      color: #ffffff;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }

    .download-btn:hover {
      background-color: var(--accent-hover);
    }

    .error-msg {
      color: #f85149;
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.4);
      padding: 1rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

    

  <div class="container">
    <div class="page-header">
        <img src="../images/downlink.ico" alt="Logo" class="page-logo">
        <h1>Downloads</h1>
    </div>

    <div id="releases-container">
      <!-- Release cards will be dynamically injected here -->
    </div>

    <a href="../rlc/" class="nav-back">&larr; Back to RocketLaunchCountdown</a>
  </div>

  <script>
    async function loadReleases() {
      const container = document.getElementById('releases-container');
      try {
        const response = await fetch('../data/rlc-install.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();

        container.innerHTML = '';

        data.releases.forEach(release => {
          const card = document.createElement('div');
          card.className = 'release-card';

          const notesList = release.release_notes
            .map(note => `<li>${note}</li>`)
            .join('');

          card.innerHTML = `
            <div class="release-header">
              <span class="release-title">${release.version}</span>
              <span class="release-date">${release.date}</span>
            </div>
            <ul class="release-notes">
              ${notesList}
            </ul>
            <a href="${release.download_path}" class="download-btn" download>
              Download ${release.version}
            </a>
          `;

          container.appendChild(card);
        });
      } catch (error) {
        container.innerHTML = `
          <div class="error-msg">
            Failed to load release data. Please ensure <code>rlc-install.json</code> is accessible.
          </div>
        `;
        console.error('Error fetching release JSON:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadReleases);
  </script>
</body>
</html>
